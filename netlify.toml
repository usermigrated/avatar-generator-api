[build]
  command = "npm install"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "serverless-http", "canvas"]
  included_files = ["fonts/**"]

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200